services:
  postgres:
    image: postgres:16-alpine
    container_name: rcd_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcd}
      POSTGRES_DB: ${POSTGRES_DB:-rcd_corp}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rcd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcd} -d ${POSTGRES_DB:-rcd_corp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: rcd_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQLSERVER_BIND:-127.0.0.1}:${SQLSERVER_PORT:-14330}:1433"
    volumes:
      - rcd_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: rcd_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}"
      POSTGRES_DB: ${POSTGRES_DB:-rcd_corp}
    entrypoint: /bin/bash
    command:
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = '$$POSTGRES_DB') CREATE DATABASE [$$POSTGRES_DB]"
    restart: "no"

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rcd_generator
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      RCD_POSTGRES_URL: "postgresql+psycopg2://${POSTGRES_USER:-rcd}:${POSTGRES_PASSWORD:-rcd}@postgres:5432/${POSTGRES_DB:-rcd_corp}"
      RCD_SQLSERVER_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD:-Rcd!Passw0rd}@sqlserver:1433/${POSTGRES_DB:-rcd_corp}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
    volumes:
      - ./output:/app/output
    command: ["rcd-data", "generate", "--profile", "${GEN_PROFILE:-demo}", "--seed", "${GEN_SEED:-42}", "--sink", "all"]
    profiles:
      - run

volumes:
  rcd_pgdata:
  rcd_mssqldata:
