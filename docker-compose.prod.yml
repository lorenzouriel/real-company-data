# Production overlay for VPS deployment. Adds continuous streaming (file sinks
# only — see DEPLOY.md), a public file server (Nginx + Basic Auth + TLS), and
# Let's Encrypt renewal on top of the base docker-compose.yml (postgres/
# sqlserver/generator are unchanged — see .env.example for the settings that
# make them safe to expose publicly).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile run up -d
#
# See DEPLOY.md for the full VPS runbook (firewall rules, secrets, TLS setup).

services:
  streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rcd_streamer
    depends_on:
      generator:
        condition: service_completed_successfully
    volumes:
      - ./output:/app/output
    command:
      - "rcd-data"
      - "stream"
      - "--profile"
      - "${GEN_PROFILE:-demo}"
      - "--seed"
      - "${GEN_SEED:-42}"
      - "--sink"
      - "all"
      - "--rows-per-tick"
      - "${STREAM_ROWS_PER_TICK:-25}"
      - "--interval"
      - "${STREAM_INTERVAL:-300}"
    restart: unless-stopped
    profiles:
      - run

  nginx:
    image: nginx:1.27-alpine
    container_name: rcd_nginx
    depends_on:
      - generator
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./output:/usr/share/nginx/output:ro
      - ./infra/nginx/rcd-data.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    profiles:
      - run

  certbot:
    image: certbot/certbot:latest
    container_name: rcd_certbot
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    # Gated behind the "tls" profile (not "run") so it never auto-starts with
    # the rest of the stack — it's meant to be invoked on demand, see DEPLOY.md:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tls run --rm certbot certonly ...
    profiles:
      - tls
